bibliography: references.bib

# Citation style is Pandoc's default (Chicago author-date).
#
# The `csl:` key used to point at https://www.zotero.org/styles/apa, which
# Pandoc fetches over the network at render time. GitHub runners reset that
# connection intermittently, and when they do the whole build fails on a
# stylesheet that affects nothing but the shape of a reference list.
#
# To use APA anyway, vendor the file rather than fetching it:
#   1. Download https://www.zotero.org/styles/apa and save it as apa.csl in
#      the repository root.
#   2. Add `cp apa.csl "$LANG/apa.csl"` to the SHARED loop in
#      tools/build_site.sh, and add en/apa.csl and id/apa.csl to .gitignore.
#   3. Add `csl: apa.csl` below.
#
# A vendored style file is reproducible and cannot fail on a network hiccup.

format:
  html:
    theme:
      light: [cosmo, theme.scss]
      dark: [darkly, theme-dark.scss]
    css: styles.css
    toc: true
    toc-depth: 3
    number-sections: true
    number-depth: 2
    code-copy: true
    code-overflow: wrap
    code-line-numbers: true
    code-annotations: hover
    code-tools: false
    highlight-style: github
    callout-appearance: simple
    fig-cap-location: bottom
    tbl-cap-location: top
    link-external-newwindow: true
    link-external-icon: false
    include-in-header:
      - text: |
          <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
          <link rel="stylesheet" href="../lms/lms.css">
          <link rel="manifest" href="../manifest.webmanifest">
          <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
          <meta name="theme-color" content="#1e40af">
          <meta name="apple-mobile-web-app-capable" content="yes">
          <meta name="apple-mobile-web-app-status-bar-style" content="default">
          <meta name="apple-mobile-web-app-title" content="Flux Pixels Planet">
          <meta name="mobile-web-app-capable" content="yes">
    include-after-body:
      - text: |
          <script src="../lms/config.js"></script>
          <script src="../lms/visitors.js"></script>
          <script src="../lms/pyodide-cell.js"></script>
          <script src="../lms/lms.js"></script>
          <script src="../lms/app.js"></script>


# ---------------------------------------------------------------------------
# PDF output is disabled on purpose.
#
# Two chapters contain mermaid diagrams. In HTML those render in the reader's
# browser via mermaid.js, which needs nothing at build time. For PDF, Quarto
# has to rasterise them first, which requires headless Chromium. On a runner
# without Chromium installed, that step does not fail cleanly: it hangs, and
# the job burns its entire time budget on one diagram.
#
# To re-enable PDF later, do both of these:
#   1. Restore the pdf: block below and add `downloads: [pdf]` to the book key.
#   2. Add these steps to .github/workflows/publish.yml, before the build:
#          - uses: quarto-dev/quarto-actions/setup@v2
#            with:
#              tinytex: true
#          - run: quarto install tool chromium --no-prompt
#
#  pdf:
#    documentclass: scrbook
#    classoption: [oneside]
#    papersize: a4
#    geometry: [inner=3cm, outer=3cm, top=2.5cm, bottom=2.5cm]
#    fontsize: 10pt
#    colorlinks: true
#    linkcolor: teal
#    urlcolor: teal
#    citecolor: teal
#    code-annotations: below
#    code-block-bg: "#f7f7f9"
#    code-block-border-left: "#1b8a6b"
#    highlight-style: github
# ---------------------------------------------------------------------------

# The Python chunks in Chapters 2, 9, 12, 15, 17 and 21 are executed when the
# book is rendered, so what a reader sees is the output of the code printed
# above it rather than a transcript of output from somewhere else. The kernel
# is plain CPython with the packages in requirements.txt; nothing here talks
# to Earth Engine, because a build that needs credentials is a build that
# breaks for everybody who does not have them.
jupyter: python3

execute:
  echo: true
  freeze: auto

  # A chunk that fails stops the render rather than publishing a chapter with
  # a hole in it. Worth the strictness: a wrong number in a teaching book is
  # worse than a failed build.
  error: false
